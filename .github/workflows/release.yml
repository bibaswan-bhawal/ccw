name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:all
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ccw-macos-arm64
            dist/ccw-macos-x64
            dist/ccw-linux-x64
          generate_release_notes: true
