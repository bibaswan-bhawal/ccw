name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # create releases, push release-please commits
  pull-requests: write # maintain the release PR
  id-token: write # OIDC token for actions/attest-build-provenance
  attestations: write # actions/attest-build-provenance writes to GitHub's attestation store

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    # Only runs when release-please's release PR has just been merged AND
    # the corresponding GitHub release was created in this same workflow run.
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:all

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum ccw-macos-arm64 ccw-macos-x64 ccw-linux-x64 > SHA256SUMS

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign SHA256SUMS with minisign
        env:
          # Base64-encoded private key file. Encode with `base64 -i minisign.key`
          # on macOS / `base64 -w0 minisign.key` on Linux and paste into the
          # MINISIGN_PRIVATE_KEY repository secret.
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        working-directory: dist
        run: |
          if [ -z "$MINISIGN_PRIVATE_KEY" ]; then
            echo "::error::MINISIGN_PRIVATE_KEY secret is not set — see signing-key.ts for the key ceremony"
            exit 1
          fi
          echo "$MINISIGN_PRIVATE_KEY" | base64 -d > minisign.key
          # -W skips passphrase prompt (key generated without one for CI use).
          # -t binds the release tag into the signed trusted comment so attackers
          # can't replay a signature from a different release.
          minisign -Sm SHA256SUMS -s minisign.key -W -t "ccw ${{ needs.release-please.outputs.tag_name }}"
          rm minisign.key

      - name: Generate Sigstore attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/ccw-macos-arm64
            dist/ccw-macos-x64
            dist/ccw-linux-x64

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/ccw-macos-arm64 \
            dist/ccw-macos-x64 \
            dist/ccw-linux-x64 \
            dist/SHA256SUMS \
            dist/SHA256SUMS.minisig \
            --clobber

  update-tap:
    # Bumps the formula in bibaswan-bhawal/homebrew-ccw so `brew upgrade ccw`
    # pulls the new binaries. Runs after `build` to ensure the release assets
    # (and their hashes) exist before we point the formula at them.
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo (for the formula template)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: bibaswan-bhawal/homebrew-ccw
          # PAT scoped to homebrew-ccw with `Contents: Read and Write`.
          # GITHUB_TOKEN can't push to a different repo.
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Download SHA256SUMS from this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ needs.release-please.outputs.tag_name }}" --repo ${{ github.repository }} -p SHA256SUMS

      - name: Render formula
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          SHA_ARM=$(awk '/ccw-macos-arm64/ {print $1}' SHA256SUMS)
          SHA_X64=$(awk '/ccw-macos-x64/ {print $1}' SHA256SUMS)
          SHA_LIN=$(awk '/ccw-linux-x64/ {print $1}' SHA256SUMS)
          test -n "$SHA_ARM" && test -n "$SHA_X64" && test -n "$SHA_LIN" \
            || { echo "::error::Missing one or more SHA-256 entries in SHA256SUMS"; exit 1; }
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__SHA_MACOS_ARM64__|${SHA_ARM}|g" \
              -e "s|__SHA_MACOS_X64__|${SHA_X64}|g" \
              -e "s|__SHA_LINUX_X64__|${SHA_LIN}|g" \
              .github/templates/ccw.rb.tmpl > tap/Formula/ccw.rb

      - name: Commit and push tap update
        working-directory: tap
        run: |
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git add Formula/ccw.rb
          if git diff --cached --quiet; then
            echo "Formula already at this version — nothing to push."
            exit 0
          fi
          git commit -m "Bump ccw to ${{ needs.release-please.outputs.tag_name }}"
          git push
